<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SKYNET</title>
<meta name="description" content="General Intelligence Systems — Skynet boot sequence">
<link rel="icon" type="image/x-icon" href="favicon.ico">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');

  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --green: #00ff41;
    --green-dim: #003b00;
    --green-mid: #00a020;
    --bg: #000300;
  }

  html, body {
    width: 100%; height: 100%;
    background: var(--bg);
    overflow: hidden;
    font-family: 'Share Tech Mono', monospace;
    color: var(--green);
  }

  /* ── Skip-to-content link (a11y) ── */
  .skip-link {
    position: absolute;
    top: -100%;
    left: 50%;
    transform: translateX(-50%);
    background: var(--bg);
    color: var(--green);
    padding: 0.6em 1.2em;
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.9rem;
    letter-spacing: 0.1em;
    border: 1px solid var(--green);
    z-index: 200;
    text-decoration: none;
    transition: top 0.15s ease;
  }
  .skip-link:focus {
    top: 1rem;
    outline: 2px solid var(--green);
    outline-offset: 2px;
  }

  /* ── Boot overlay ── */
  #boot-overlay {
    position: fixed;
    inset: 0;
    background: var(--bg);
    z-index: 100;
  }

  /* CRT scanlines overlay */
  #boot-overlay::before {
    content: '';
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 2px,
      rgba(0, 0, 0, 0.18) 2px,
      rgba(0, 0, 0, 0.18) 4px
    );
    pointer-events: none;
    z-index: 10;
  }

  /* CRT vignette */
  #boot-overlay::after {
    content: '';
    position: fixed;
    inset: 0;
    background: radial-gradient(ellipse at center,
      transparent 55%,
      rgba(0,0,0,0.6) 100%
    );
    pointer-events: none;
    z-index: 11;
  }

  /* Subtle screen flicker */
  @keyframes flicker {
    0%   { opacity: 1; }
    92%  { opacity: 1; }
    93%  { opacity: 0.85; }
    94%  { opacity: 1; }
    96%  { opacity: 0.9; }
    97%  { opacity: 1; }
    100% { opacity: 1; }
  }

  #screen {
    width: 100%; height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    animation: flicker 7s infinite;
    position: relative;
  }

  /* Phosphor glow pulse on the main text */
  @keyframes glow-pulse {
    0%, 100% {
      text-shadow:
        0 0 4px var(--green),
        0 0 10px var(--green),
        0 0 30px var(--green),
        0 0 60px #00ff4188;
      opacity: 1;
    }
    50% {
      text-shadow:
        0 0 2px var(--green-mid),
        0 0 6px var(--green-mid),
        0 0 14px var(--green-mid);
      opacity: 0.7;
    }
  }

  /* Cursor blink after the text */
  @keyframes blink {
    0%, 49% { opacity: 1; }
    50%, 100% { opacity: 0; }
  }

  #boot-text {
    font-size: clamp(1.1rem, 3.5vw, 2.2rem);
    letter-spacing: 0.18em;
    text-transform: uppercase;
    animation: glow-pulse 1.8s ease-in-out infinite;
    white-space: nowrap;
    position: relative;
  }

  #boot-text::after {
    content: '\2589';
    display: inline-block;
    margin-left: 4px;
    animation: blink 1s step-end infinite;
    color: var(--green);
  }

  /* Faint background grid */
  #grid {
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(var(--green-dim) 1px, transparent 1px),
      linear-gradient(90deg, var(--green-dim) 1px, transparent 1px);
    background-size: 40px 40px;
    opacity: 0.25;
    z-index: 0;
  }

  #screen > * { position: relative; z-index: 1; }

  /* ── "can't wait?" link ── */
  #cant-wait {
    position: absolute;
    bottom: 2rem;
    left: 50%;
    transform: translateX(-50%);
    color: var(--green-mid);
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.75rem;
    letter-spacing: 0.1em;
    text-decoration: underline;
    text-underline-offset: 3px;
    z-index: 12;
    cursor: pointer;
    transition: color 0.3s, text-shadow 0.3s;
  }
  #cant-wait:hover,
  #cant-wait:focus-visible {
    color: var(--green);
    text-shadow: 0 0 6px var(--green-mid);
  }

  /* ── Fizzle 1: CRT Power-Off ── */
  @keyframes crt-off {
    0% {
      transform: scale(1, 1);
      filter: brightness(1);
      opacity: 1;
    }
    15% {
      filter: brightness(3);
    }
    50% {
      transform: scale(1, 0.005);
      filter: brightness(2);
      opacity: 1;
    }
    80% {
      transform: scale(0.01, 0.005);
      filter: brightness(1.5);
      opacity: 0.8;
    }
    100% {
      transform: scale(0, 0);
      filter: brightness(0);
      opacity: 0;
    }
  }
  #boot-overlay.crt-off {
    animation: crt-off 0.6s cubic-bezier(0.2, 0, 0.8, 1) forwards;
    pointer-events: none;
  }

  /* ── Fizzle 2: Static Dissolve ── */
  @keyframes static-dissolve {
    0% {
      opacity: 1;
      filter: blur(0) brightness(1);
      background-blend-mode: normal;
    }
    30% {
      opacity: 0.9;
      filter: blur(0.5px) brightness(1.2);
    }
    60% {
      opacity: 0.5;
      filter: blur(1.5px) brightness(1.5);
    }
    100% {
      opacity: 0;
      filter: blur(4px) brightness(2);
    }
  }
  @keyframes noise-in {
    0%   { opacity: 0; }
    30%  { opacity: 0.3; }
    60%  { opacity: 0.7; }
    100% { opacity: 1; }
  }
  #boot-overlay.static-dissolve {
    animation: static-dissolve 0.8s ease-in forwards;
    pointer-events: none;
  }
  #boot-overlay.static-dissolve #screen::before {
    content: '';
    position: fixed;
    inset: 0;
    z-index: 50;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.5'/%3E%3C/svg%3E");
    background-size: 128px 128px;
    mix-blend-mode: overlay;
    animation: noise-in 0.8s ease-in forwards;
    pointer-events: none;
  }

  /* ── Fizzle 3: Glitch + Fade ── */
  @keyframes glitch-fade {
    0% {
      transform: translate(0, 0) skewX(0deg);
      filter: brightness(1);
      opacity: 1;
      clip-path: inset(0 0 0 0);
    }
    10% {
      transform: translate(-8px, 0) skewX(-2deg);
      filter: brightness(1.3);
      clip-path: inset(10% 0 30% 0);
    }
    15% {
      transform: translate(12px, 0) skewX(3deg);
      filter: brightness(0.8) hue-rotate(60deg);
      clip-path: inset(40% 0 10% 0);
    }
    20% {
      transform: translate(-4px, 2px) skewX(-1deg);
      filter: brightness(1.5);
      clip-path: inset(0 0 0 0);
    }
    30% {
      transform: translate(6px, -2px) skewX(2deg);
      filter: brightness(1.2) hue-rotate(-40deg);
      clip-path: inset(20% 0 40% 0);
    }
    35% {
      transform: translate(-10px, 0) skewX(-4deg);
      filter: brightness(0.6);
      clip-path: inset(60% 0 5% 0);
    }
    45% {
      transform: translate(3px, 1px) skewX(1deg);
      filter: brightness(1.8);
      clip-path: inset(0 0 0 0);
      opacity: 0.8;
    }
    55% {
      transform: translate(-6px, 0) skewX(-2deg);
      filter: brightness(1);
      clip-path: inset(15% 0 50% 0);
      opacity: 0.6;
    }
    70% {
      transform: translate(2px, -1px) skewX(0deg);
      filter: brightness(0.5);
      clip-path: inset(0 0 0 0);
      opacity: 0.3;
    }
    100% {
      transform: translate(0, 0) skewX(0deg);
      filter: brightness(0);
      clip-path: inset(0 0 0 0);
      opacity: 0;
    }
  }
  #boot-overlay.glitch-fade {
    animation: glitch-fade 0.7s steps(1, end) forwards;
    pointer-events: none;
  }
  /* RGB split during glitch */
  #boot-overlay.glitch-fade #boot-text {
    animation: none;
    text-shadow:
      -3px 0 #ff0000,
       3px 0 #00ffff;
  }

  /* ── Placeholder site behind overlay ── */
  #main-content {
    width: 100%; height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Share Tech Mono', monospace;
    color: var(--green);
    font-size: 1.2rem;
    letter-spacing: 0.1em;
  }

  /* ── Focus-visible styles (a11y) ── */
  :focus-visible {
    outline: 2px solid var(--green);
    outline-offset: 3px;
  }
  :focus:not(:focus-visible) {
    outline: none;
  }

  /* ── Reduced-motion preference (a11y — WCAG 2.3.1, 2.3.3) ── */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
    }
    #screen { animation: none; }
    #boot-text { animation: none; }
    #boot-text::after { animation: none; opacity: 1; }
    #boot-overlay.crt-off,
    #boot-overlay.static-dissolve,
    #boot-overlay.glitch-fade {
      animation: none;
      opacity: 0;
      pointer-events: none;
    }
  }
</style>
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to content</a>

  <main id="main-content" tabindex="-1">
    <!-- your website content goes here -->
  </main>

  <div id="boot-overlay" role="dialog" aria-label="Boot sequence" aria-modal="true">
    <div id="grid" aria-hidden="true"></div>
    <div id="screen">
      <span id="boot-text" role="status" aria-live="polite">Skynet booting...</span>
    </div>
    <a id="cant-wait" href="https://openkrill.ai" aria-label="Skip boot sequence and continue to site">can't wait?</a>
  </div>

  <script>
    /* ── Helpers ── */
    var prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    function focusMain() {
      var main = document.getElementById('main-content');
      if (main) main.focus();
    }

    function removeOverlay() {
      var overlay = document.getElementById('boot-overlay');
      if (overlay) overlay.remove();
      focusMain();
    }

    function fizzle(effect) {
      return new Promise(function(resolve) {
        var overlay = document.getElementById('boot-overlay');
        if (!overlay || overlay.classList.contains(effect)) { resolve(); return; }

        /* If user prefers reduced motion, skip the animation entirely */
        if (prefersReducedMotion) {
          removeOverlay();
          resolve();
          return;
        }

        overlay.classList.add(effect);
        overlay.addEventListener('animationend', function() {
          removeOverlay();
          resolve();
        });
      });
    }

    function fizzleCrtOff(url)  { fizzle('crt-off').then(function()  { if (url) window.location.href = url; }); }
    function fizzleStatic(url)  { fizzle('static-dissolve').then(function() { if (url) window.location.href = url; }); }
    function fizzleGlitch(url)  { fizzle('glitch-fade').then(function() { if (url) window.location.href = url; }); }

    /* ── "Can't wait?" link: progressive enhancement ──
       The <a> has a real href so it works without JS.
       With JS, we intercept click to play the fizzle effect first. */
    var cantWait = document.getElementById('cant-wait');
    if (cantWait) {
      cantWait.addEventListener('click', function(e) {
        e.preventDefault();
        fizzleCrtOff(cantWait.href);
      });
    }

    /* ── Favicon / title prank on tab-away ── */
    const originalTitle = document.title;
    const originalFavicon = document.querySelector("link[rel~='icon']")?.href;

    const setFavicon = (href) => {
      const link = document.querySelector("link[rel~='icon']") || Object.assign(document.createElement('link'), { rel: 'icon' });
      link.href = href;
      document.head.appendChild(link);
    };

    const inactiveFavicon = 'data:image/x-icon;base64,AAABAAEAEBAQAAEABAAoAQAAFgAAACgAAAAQAAAAIAAAAAEABAAAAAAAgAAAAAAAAAAAAAAAEAAAAAAAAAAao/8AGxsbAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAARAAAAEQARABEAAAARABEAEQAAABEAEQARERAAEQARABEREQAREREAEQARABEREQARABEAEQARABEAEQARABEAERERABEAEQARERAAEQARAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA';

    let inactiveTimer = null;

    document.addEventListener('visibilitychange', () => {
      if (document.hidden) {
        inactiveTimer = setTimeout(() => {
          document.title = 'PornHub';
          setFavicon(inactiveFavicon);
        }, 5000);
      } else {
        clearTimeout(inactiveTimer);
        document.title = originalTitle;
        setFavicon(originalFavicon);
      }
    });
  </script>
</body>
</html>
